name: Release

# Builds the figcraft-server image for amd64 and arm64 and pushes it to GHCR.
# The image version is the upstream FigCraft version pinned in the Dockerfile
# (ARG FIGCRAFT_VERSION), so upgrading is a one-line commit to main. Pushes that
# don't touch the image (docs, README) are skipped. Run it by hand from the
# Actions tab to rebuild the current version, e.g. to pick up base image fixes.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/figcraft-server

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          version=$(sed -n 's/^ARG FIGCRAFT_VERSION=\(.*\)$/\1/p' Dockerfile | head -1)
          if [ -z "$version" ]; then
            echo "::error::No ARG FIGCRAFT_VERSION=<version> line in the Dockerfile"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging FigCraft v$version" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: FIGCRAFT_VERSION=${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
